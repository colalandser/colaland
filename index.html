<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLALAND — Minecraft Server</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
        /* Фон с эффектом колы */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(139, 0, 0, 0.6), rgba(0, 0, 0, 0.9));
            z-index: -1;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(255, 0, 0, 0.3);
            border: 2px solid #ff4d4d;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: #ddd;
        }
        .versions {
            display: inline-block;
            background: #ff3333;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            box-shadow: 0 4px 10px rgba(255, 51, 51, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>COLALAND</h1>
        <p>Добро пожаловать на наш Minecraft сервер!</p>
        <div class="versions">Версии: 1.21.4 — 1.21.11</div>
    </div>

</body>
</html>
