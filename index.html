<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>COLALEND — Официальный IP и информация о сервере</title>
<meta name="description" content="Colalend — Майнкрафт сервер. Заходи играть, версии 1.21.4 — 1.21.11. IP сервера и вся инфа здесь!">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#13161f">
<style>
:root{--bg:#13161f;--card:#1c2030;--text:#eef0f6;--muted:#9aa1b5;--accent:#ff4d4d;--line:#2c3248}
html{scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Century Gothic',Futura,'Trebuchet MS',sans-serif;line-height:1.5}
.hero{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;padding:40px 20px;background:linear-gradient(135deg, rgba(139, 0, 0, 0.6), rgba(19, 22, 31, 0.95))}
.tag{font-size:14px;letter-spacing:.25em;font-weight:700;text-transform:uppercase;margin:0 0 20px;color:#ff6b6b;}
h1{font-size:clamp(45px,10vw,100px);letter-spacing:.04em;line-height:1;margin:0 0 15px;font-weight:600;color:#ff4d4d;text-shadow: 0 0 20px rgba(255, 77, 77, 0.4);}
.lead{font-size:clamp(16px,2.5vw,20px);margin:0 0 25px;max-width:700px;color:#ddd}
.pill{background:#ff4d4d;color:#fff;padding:12px 28px;border-radius:999px;font-weight:700;font-size:15px;letter-spacing:.03em;text-transform:uppercase;box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);display:inline-block;margin-bottom:30px;}
.content{max-width:800px;margin:0 auto;padding:50px 20px 100px;text-align:center;}
h2{font-size:28px;margin-bottom:15px;color:#fff;}
.ip-container{background:var(--card);border:2px solid var(--accent);border-radius:16px;padding:25px;margin:20px 0 35px;box-shadow: 0 8px 25px rgba(0,0,0,0.3);}
.ip-title{font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.ip-address{font-size:clamp(20px, 4vw, 32px);font-weight:bold;color:#fff;word-break:break-all;user-select:all;}
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;margin-top:30px;text-align:left;}
.block{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:20px;}
.block b{display:block;font-size:18px;margin-bottom:6px;color:#fff}
.block span{color:var(--muted);font-size:14px}
</style>
</head>
<body>

<header class="hero">
  <div class="tag">Minecraft Java Server</div>
  <h1>COLALEND</h1>
  <p class="lead">Добро пожаловать на наш сервер!</p>
  <div class="pill">Версии: 1.21.4 — 1.21.11</div>
</header>

<section class="content">
  <h2>IP-адрес сервера</h2>
  <p style="color: var(--muted); margin-top: 0;">Нажми на адрес, чтобы скопировать его:</p>
  
  <div class="ip-container">
    <div class="ip-title">Основной IP</div>
    <div class="ip-address">colalend.tilda.ws</div> <!-- Здесь можешь вписать точный IP или домен, если сменится -->
  </div>

  <div class="blocks">
    <div class="block">
      <b>Версии</b>
      <span>Поддерживаются клиенты от 1.21.4 до 1.21.11</span>
    </div>
    <div class="block">
      <b>Игровой процесс</b>
      <span>Классическое выживание и постройки</span>
    </div>
  </div>
</section>

</body>
</html>
